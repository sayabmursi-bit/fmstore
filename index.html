<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0907">
<title>FM STORE | كارت رقمي</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
tailwind.config = {
  theme: { extend: {
    colors: { ink: '#0B0907', gold: { 300:'#F1D58A', 400:'#E2B95B', 500:'#C9A04A', 600:'#A47E2F' } },
    fontFamily: { sans: ['Tajawal','system-ui','sans-serif'], brand: ['Reem Kufi','Tajawal','serif'] }
  } }
}
</script>
<style>
  html, body { min-height: 100%; min-height: 100dvh; background: #0B0907; -webkit-tap-highlight-color: transparent; }
  .glass { background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
           border: 1px solid rgba(226,185,91,.22); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .gold-text { background: linear-gradient(120deg,#F1D58A,#C9A04A 55%,#F1D58A); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .gold-btn { background: linear-gradient(120deg,#F1D58A,#C9A04A 60%,#E2B95B); color: #1A1306; box-shadow: 0 10px 30px -8px rgba(201,160,74,.55); }
  .press { transition: transform .15s ease, filter .15s ease; }
  .press:active { transform: scale(.97); filter: brightness(.95); }
  :focus-visible { outline: 2px solid #F1D58A; outline-offset: 3px; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
  .rise { animation: rise .7s ease both; }
  @media (prefers-reduced-motion: reduce) { .rise { animation: none } .press { transition: none } }
</style>
</head>

<!-- إشعار -->
<div id="toast" role="status" aria-live="polite"
  class="fixed left-1/2 -translate-x-1/2 bottom-[max(1.5rem,env(safe-area-inset-bottom))] px-5 py-3 rounded-full gold-btn font-bold text-sm opacity-0 pointer-events-none transition-opacity duration-300">
</div>

<script>
/* ===== بيانات الكارت: عدّل هنا فقط ===== */
const CARD = {
  name:      'FM STORE',
  title:     'Accessories & Perfumes',
  org:       'FM STORE',
  note:      'تألق . جمال . أناقة - اكسسوارات ومخمريات رهيبة',
  phone:     '+966550584655',
  instagram: 'FM_STORE249',
  tiktok:    'fmstore249',          // اسم المستخدم في رابط تيك توك (بدون @)
  // الموقع: الرياض، السعودية فقط (المتجر أونلاين بدون فرع ثابت)
  mapUrl:    'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('الرياض، السعودية'),
  welcome:   'السلام عليكم، أرغب بالاستفسار عن منتجاتكم'
};
const IG_URL = 'https://www.instagram.com/' + CARD.instagram;
const TT_URL = 'https://www.tiktok.com/@' + CARD.tiktok;
const waNumber = CARD.phone.replace(/\D/g, '');

const $ = (id) => document.getElementById(id);
$('waLink').href  = 'https://wa.me/' + waNumber + '?text=' + encodeURIComponent(CARD.welcome);
$('mapLink').href = CARD.mapUrl;
$('callLink').href = 'tel:' + CARD.phone;
$('igLink').href  = IG_URL;
$('ttLink').href  = TT_URL;

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.opacity = '0'), 2200);
}

/* ===== حفظ جهة اتصال (vCard 3.0) ===== */
function esc(s) { return String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
function buildVCard() {
  return [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N;CHARSET=UTF-8:' + esc(CARD.name) + ';;;;',
    'FN;CHARSET=UTF-8:' + esc(CARD.name),
    'ORG;CHARSET=UTF-8:' + esc(CARD.org),
    'TITLE;CHARSET=UTF-8:' + esc(CARD.title),
    'TEL;TYPE=CELL,VOICE,WORK:' + CARD.phone,
    'URL;TYPE=Instagram:' + IG_URL,
    'URL;TYPE=TikTok:' + TT_URL,
    'NOTE;CHARSET=UTF-8:' + esc(CARD.note + ' | Instagram: ' + CARD.instagram + ' | TikTok: @' + CARD.tiktok),
    'END:VCARD'
  ].join('\r\n');
}
const UA = navigator.userAgent || '';
const IS_IOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IN_APP = /Instagram|FBAN|FBAV|TikTok|musical_ly|Snapchat|Line\//i.test(UA);

$('saveBtn').addEventListener('click', () => {
  try {
    const blob = new Blob([buildVCard()], { type: 'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    if (IS_IOS) {
      // آيفون: فتح الملف مباشرة يظهر نافذة "إضافة جهة اتصال"
      window.location.href = url;
    } else {
      const a = document.createElement('a');
      a.href = url;
      a.download = 'FM-STORE.vcf';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('تم تجهيز جهة الاتصال');
  } catch (e) {
    toast('تعذّر تحميل جهة الاتصال');
  }
});

/* متصفح انستغرام/تيك توك الداخلي قد يمنع التحميل */
if (IN_APP) {
  const n = document.createElement('p');
  n.className = 'text-center text-xs text-gold-300/90 -mt-3';
  n.textContent = 'لحفظ جهة الاتصال: اضغط ⋯ ثم «فتح في المتصفح»';
  $('saveBtn').after(n);
}

/* ===== مشاركة الكارت (Web Share API) ===== */
$('shareBtn').addEventListener('click', async () => {
  const data = { title: 'FM STORE', text: 'FM STORE - اكسسوارات ومخمريات رهيبة. تألق . جمال . أناقة', url: location.href };
  if (navigator.share) {
    try { await navigator.share(data); } catch (e) { /* أغلق المستخدم النافذة */ }
  } else {
    try { await navigator.clipboard.writeText(location.href); toast('تم نسخ رابط الكارت'); }
    catch (e) { toast('المشاركة غير مدعومة في هذا المتصفح'); }
  }
});
</script>
